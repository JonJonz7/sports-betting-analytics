[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeiq"
version = "0.1.0"
description = "Quantitative sports betting analytics engine"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Data pipeline
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "duckdb>=1.1,<2",
    "requests>=2.32",
    # Models
    "scipy>=1.11",
    "scikit-learn>=1.5",
    # Serving
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "streamlit>=1.39",
    "plotly>=5.24",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Modules for live operation that the batch pipeline doesn't use (see docs/ROADMAP.md)
live = [
    "anthropic>=0.39",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
