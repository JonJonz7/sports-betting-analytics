[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeiq"
version = "0.1.0"
description = "Quantitative sports betting analytics engine"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Core
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",

    # ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",

    # API
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",

    # Database
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "redis>=5.0",

    # AI
    "anthropic>=0.39",

    # Dashboard
    "streamlit>=1.28",
    "plotly>=5.18",

    # Background jobs
    "celery[redis]>=5.3",

    # Config
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
