# CI: every push / PR -> lint, tests (incl. end-to-end on the synthetic sample), demo pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: pytest -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  demo:
    name: Pipeline on synthetic sample
    runs-on: ubuntu-latest
    needs: test
    env:
      EDGEIQ_DATA_DIR: ${{ github.workspace }}/data/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.cli all --source sample
      - run: cat reports/report_sample.md >> "$GITHUB_STEP_SUMMARY"
