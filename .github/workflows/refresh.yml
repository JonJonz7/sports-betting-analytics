# Weekly refresh on REAL data: download nflverse games + closing lines, rebuild,
# backtest and publish the report (job summary + artifact). Runs Tuesdays after
# Monday Night Football, and on demand. Nothing is committed back to the repo.
name: Weekly refresh (real NFL data)

on:
  schedule:
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full pipeline on nflverse data
        run: python -m src.cli all --source nflverse
      - run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: edgeiq-report-${{ github.run_number }}
          path: |
            reports/report.md
            data/lake/_manifest.jsonl
