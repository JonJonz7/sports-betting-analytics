# Target design for LIVE odds capture (TimescaleDB + Redis). Not used by the batch
# pipeline (`make run` uses Parquet + DuckDB). See ARCHITECTURE.md, "Live system (designed)".
version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: edgeiq
      POSTGRES_USER: edgeiq
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edgeiq_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d  # auto-run migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://edgeiq:${DB_PASSWORD:-edgeiq_dev}@postgres:5432/edgeiq
      REDIS_URL: redis://redis:6379/0
      ODDS_API_KEY: ${ODDS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
